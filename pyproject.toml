[project]
name = "meetdown"
version = "0.1.0"
description = "Generate Markdown meeting transcripts from speech-to-text JSON."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["httpx>=0.27.0", "imageio-ffmpeg>=0.6.0"]

[project.scripts]
meetdown = "meetdown.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[build-system]
requires = ["uv_build>=0.11.12,<0.12"]
build-backend = "uv_build"

[tool.pyright]
typeCheckingMode = "strict"
